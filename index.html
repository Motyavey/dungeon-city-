function mkMon(f,boss,x,y){const pool=MON.filter(m=>m.mf<=f&&m.n!='Дракон'),t=boss&&f>=10?MON[10]:boss?pool[pool.length-1]:P(pool.slice(-4));

return{k:'m',x,y,n:(boss?'Вожак: ':'')+t.n,e:t.e,hp,max:hp,ac:t.ac+(boss?1:0),at:t.at+(f/3|0),d:t.d,xp:t.xp*(boss?3:1),boss,stun:0}}
function gen(f){const W=27,H=27,m=Array.from({length:H},()=>Array(W).fill(1)),rooms=[];
for(let i=0;i<90&&rooms.length<8;i++){const w=3+R(4),hh=3+R(3),x=1+R(W-w-2),y=1+R(H-hh-2);
if(rooms.some(r=>x<=r.x+r.w&&x+w>=r.x&&y<=r.y+r.h&&y+hh>=r.y))continue;rooms.push({x,y,w,h:hh});for(let j=y;j<y+hh;j++)for(let k=x;k<x+w;k++)m[j][k]=0}
if(rooms.length<3)return gen(f);
const ct=r=>[r.x+(r.w>>1),r.y+(r.h>>1)];
for(let i=1;i<rooms.length;i++){const[a,b]=ct(rooms[i-1]),[c,e]=ct(rooms[i]);for(let k=Math.min(a,c);k<=Math.max(a,c);k++)m[b][k]=0;for(let j=Math.min(b,e);j<=Math.max(b,e);j++)m[j][c]=0}
const ents=[],used=new Set(),fr=r=>{for(let t=0;t<30;t++){const x=r.x+R(r.w),y=r.y+R(r.h),k=x+','+y;if(!used.has(k)){used.add(k);return[x,y]}}return null};
const[px,py]=ct(rooms[0]);used.add(px+','+py);const[sx,sy]=ct(rooms[rooms.length-1]);used.add(sx+','+sy);ents.push({k:'s',x:sx,y:sy});
rooms.slice(1).forEach((r,i)=>{const last=i==rooms.length-2;
if(last&&f%5==0){const p=fr(r);if(p)ents.push(mkMon(f,1,p[0],p[1]))}
else for(let n=1+(R(3)==0?1:0);n>0;n--){const p=fr(r);if(p)ents.push(mkMon(f,0,p[0],p[1]))}
if(Math.random()<.4){const p=fr(r);if(p)ents.push({k:'c',x:p[0],y:p[1]})}
if(Math.random()<.3){const p=fr(r);if(p)ents.push({k:'p',x:p[0],y:p[1]})}
if(Math.random()<.3){const p=fr(r);if(p)ents.push({k:'t',x:p[0],y:p[1]})}});
